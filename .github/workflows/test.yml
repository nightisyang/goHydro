name: Go maintenance regressions

on:
  push:
    branches: [master, 'maintenance/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Verify reproducible dependencies
        run: |
          go mod download
          go mod verify
          go mod tidy -diff
      - name: Run regression and reference comparisons with race detection
        run: go test -mod=readonly -race -count=1 ./...
      - name: Vet root module
        run: go vet -mod=readonly ./...
